<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-In Form | MindScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="form-page">
    <div class="page-noise" aria-hidden="true"></div>
    <main class="form-shell form-reference-shell">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" style="position: fixed; top: 24px; right: 24px; z-index: 100;"></button>
      <section class="reference-intro">
        <a href="./index.html" class="brand-mark light-brand">MindScope</a>
      </section>

      <section class="form-window-shell" data-form-window-shell>
        <div class="form-window" data-form-window>
          <img
            class="form-bg-frame"
            src="./assets/images/BG-animation-frames/frame_000.png"
            alt=""
            aria-hidden="true"
            data-bg-frame-animation
            data-frame-count="36"
          />
          <div class="window-bar">
            <div class="window-title">Scholar Check-In</div>
            <div class="window-controls">
              <button
                type="button"
                class="window-control window-minimize"
                aria-label="Minimize check-in panel"
                data-window-minimize
              ></button>
              <button
                type="button"
                class="window-control window-maximize"
                aria-label="Restore check-in panel"
                data-window-restore
              ></button>
              <button
                type="button"
                class="window-control window-close"
                aria-label="Close check-in panel and return to profile"
                data-window-close
              ></button>
            </div>
          </div>

          <form class="reference-form" data-form-window-body>
            <aside class="comfort-bubble">
              <img
                src="./assets/images/calm-companion-idle.svg"
                alt="Animated pixel-style forest companion illustration"
              />
            </aside>

            <div class="question-stack">
              <div class="sheet-nav" role="tablist" aria-label="Questionnaire sections">
                <button type="button" class="sheet-tab is-active" data-sheet-tab="0" role="tab" aria-selected="true">1</button>
                <button type="button" class="sheet-tab" data-sheet-tab="1" role="tab" aria-selected="false">2</button>
                <button type="button" class="sheet-tab" data-sheet-tab="2" role="tab" aria-selected="false">3</button>
              </div>
              <div class="restore-checkin-bar">
                <button type="button" class="secondary-button" data-restore-checkin>Restore Previous Check-In</button>
                <span data-restore-status></span>
              </div>

              <section class="question-sheet is-active" data-question-sheet>
                <div class="sheet-heading">
                  <span>Sheet 1 of 3</span>
                  <h2>Scholar Profile</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Full Name</span>
                    <input type="text" placeholder="Enter your full name" autocomplete="name" data-user-name required />
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Current degree level</span>
                    <select name="degree_level" data-numeric="true" required>
                      <option value="" selected disabled>Select degree level</option>
                      <option value="0">Master's / postgraduate scholar</option>
                      <option value="1">PhD / doctoral scholar</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Study mode</span>
                    <select name="study_mode" data-numeric="true" required>
                      <option value="" selected disabled>Select study mode</option>
                      <option value="0">Full-time</option>
                      <option value="1">Part-time</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Funding status</span>
                    <select name="funding_status" data-numeric="true" required>
                      <option value="" selected disabled>Select funding status</option>
                      <option value="0">Self-funded</option>
                      <option value="1">Partially funded</option>
                      <option value="2">Fully funded / scholarship</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Program year</span>
                    <select name="program_year" data-numeric="true" required>
                      <option value="" selected disabled>Select program year</option>
                      <option value="1">Year 1</option>
                      <option value="2">Year 2</option>
                      <option value="3">Year 3</option>
                      <option value="4">Year 4</option>
                      <option value="5">Year 5 or above</option>
                    </select>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 2 of 3</span>
                  <h2>Academic Workload</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Approximate weekly academic/research hours</span>
                    <input name="weekly_hours" type="number" min="0" max="100" step="1" placeholder="Example: 40" required />
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How often do you meet or receive guidance from your supervisor?</span>
                    <select name="supervisor_freq" data-numeric="true" required>
                      <option value="" selected disabled>Select frequency</option>
                      <option value="1">Rarely or never</option>
                      <option value="2">Monthly</option>
                      <option value="3">Every 2-3 weeks</option>
                      <option value="4">Weekly or more</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Caregiving or major household responsibility</span>
                    <select name="caregiving" data-numeric="true" required>
                      <option value="" selected disabled>Select responsibility level</option>
                      <option value="0">No regular responsibility</option>
                      <option value="1">Occasional responsibility</option>
                      <option value="2">Regular or primary responsibility</option>
                    </select>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 3 of 3</span>
                  <h2>Functioning and Reflection</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Overall academic stressor load</span>
                    <div class="answer-box">
                      <input name="stressor_index" type="range" min="1" max="5" step="0.1" value="3" required />
                      <span>1 = low stressor load, 5 = high stressor load</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Research productivity over the past month</span>
                    <div class="answer-box">
                      <input name="productivity_index" type="range" min="1" max="5" step="0.1" value="3" required />
                      <span>1 = very low productivity, 5 = very high productivity</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Coping capacity over the past month</span>
                    <div class="answer-box">
                      <input name="coping_index" type="range" min="1" max="5" step="0.1" value="3" required />
                      <span>1 = poor coping, 5 = strong coping</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Primary stressor note</span>
                    <textarea
                      name="primary_stressor_note"
                      rows="4"
                      placeholder="Briefly note the main academic or personal stressor affecting this score..."
                    ></textarea>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Coping support note</span>
                    <textarea
                      name="coping_support_note"
                      rows="4"
                      placeholder="Briefly note the support, habit, or resource helping you cope..."
                    ></textarea>
                  </label>
                </div>
              </section>

              <div class="form-actions reference-actions">
                <button type="button" class="ghost-link light-link sheet-back" data-sheet-back disabled>Back</button>
                <button type="button" class="primary-button sheet-next" data-sheet-next>Next sheet</button>
                <button type="submit" class="primary-button sheet-submit is-locked" data-sheet-submit hidden disabled aria-disabled="true">Submit check-in</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="./assets/app.js"></script>
  </body>
</html>
