<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindScope Research Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="landing-shell">
    <div class="page-noise" aria-hidden="true"></div>
    <header class="top-nav" style="padding: 16px 24px; position: fixed; top: 0; right: 0; z-index: 100;">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
    </header>
    <main class="landing-page">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">AI-Based Mental Well-Being Analysis</p>
          <h1>MindScope for Research Scholars</h1>
          <div class="hero-actions">
            <a class="primary-button" href="./login.html">Open Login</a>
            <a class="secondary-button" href="./form.html">View Check-In Form</a>
          </div>
        </div>
        <div class="hero-visual">
          <img
            src="./assets/images/research-mind.svg"
            alt="Illustration of a researcher with a calm mind map and floating notes"
          />
        </div>
      </section>

      <section class="preview-grid">
        <a class="preview-card" href="./login.html">
          <span class="preview-tag">Page 1</span>
          <h2>Secure Login</h2>
        </a>
        <a class="preview-card" href="./profile.html">
          <span class="preview-tag">Page 2</span>
          <h2>Progress Profile</h2>
        </a>
        <a class="preview-card" href="./form.html">
          <span class="preview-tag">Page 3</span>
          <h2>Data Collection</h2>
        </a>
      </section>
    </main>
    <script src="./assets/app.js"></script>
  </body>
</html>
