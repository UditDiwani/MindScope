<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Login | MindScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="page-noise" aria-hidden="true"></div>
    <main class="auth-layout">
      <section class="auth-showcase glass-panel">
        <nav class="top-nav">
          <a href="./index.html" class="brand-mark">MindScope</a>
          <div style="display: flex; gap: 16px; align-items: center;">
            <a href="./profile.html" class="ghost-link">Preview Profile</a>
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
          </div>
        </nav>

        <div class="showcase-content">
          <h1>Welcome back to your calm research space.</h1>
        </div>

        <div class="showcase-image">
          <img
            src="./assets/images/focus-garden.svg"
            data-theme-image
            data-light-src="./assets/images/focus-garden.svg"
            data-dark-src="./assets/images/focus-garden-dark.svg"
            alt="Calming illustration showing plants, notes, and a softly glowing laptop"
          />
        </div>
      </section>

      <section class="auth-form-card glass-panel">
        <div class="form-header">
          <h2>Sign in</h2>
        </div>

        <form class="stack-form" data-demo-form>
          <label>
            Institutional email
            <input type="email" placeholder="researcher@university.edu" required />
          </label>

          <label>
            Password
            <div class="password-row">
              <input
                id="password-field"
                type="password"
                placeholder="Enter your password"
                minlength="10"
                required
              />
              <button type="button" class="toggle-button" data-toggle-password>
                Show
              </button>
            </div>
          </label>

          <div class="check-row">
            <a href="#" class="ghost-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-button wide-button">
            Sign in
          </button>
        </form>
      </section>
    </main>

    <script src="./assets/app.js"></script>
  </body>
</html>
