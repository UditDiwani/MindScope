<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-In Form | MindScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="page-noise" aria-hidden="true"></div>
    <main class="form-shell form-reference-shell">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" style="position: fixed; top: 24px; right: 24px; z-index: 100;"></button>
      <section class="reference-intro">
        <a href="./index.html" class="brand-mark light-brand">MindScope</a>
      </section>

      <section class="form-window-shell">
        <div class="form-window" data-form-window>
          <div class="window-bar">
            <div class="window-title">Scholar Check-In</div>
            <div class="window-controls">
              <button
                type="button"
                class="window-control window-minimize"
                aria-label="Minimize check-in panel"
                data-window-minimize
              ></button>
              <button
                type="button"
                class="window-control window-maximize"
                aria-label="Restore check-in panel"
                data-window-restore
              ></button>
              <button
                type="button"
                class="window-control window-close"
                aria-label="Close check-in panel and return to profile"
                data-window-close
              ></button>
            </div>
          </div>

          <form class="reference-form" data-form-window-body>
            <aside class="comfort-bubble">
              <img
                src="./assets/images/calm-companion-idle.svg"
                alt="Animated pixel-style forest companion illustration"
              />
            </aside>

            <div class="question-stack">
              <div class="sheet-nav" role="tablist" aria-label="Questionnaire sections">
                <button type="button" class="sheet-tab is-active" data-sheet-tab="0" role="tab" aria-selected="true">1</button>
                <button type="button" class="sheet-tab" data-sheet-tab="1" role="tab" aria-selected="false">2</button>
                <button type="button" class="sheet-tab" data-sheet-tab="2" role="tab" aria-selected="false">3</button>
                <button type="button" class="sheet-tab" data-sheet-tab="3" role="tab" aria-selected="false">4</button>
                <button type="button" class="sheet-tab" data-sheet-tab="4" role="tab" aria-selected="false">5</button>
              </div>

              <section class="question-sheet is-active" data-question-sheet>
                <div class="sheet-heading">
                  <span>Sheet 1 of 5</span>
                  <h2>Demographic Information</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Age</span>
                    <select required>
                      <option value="" selected disabled>Select age range</option>
                      <option>21-25</option>
                      <option>26-30</option>
                      <option>31-35</option>
                      <option>36-40</option>
                      <option>40+</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Gender</span>
                    <select required>
                      <option value="" selected disabled>Select gender</option>
                      <option>Male</option>
                      <option>Female</option>
                      <option>Prefer not to say</option>
                      <option>Other</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Marital Status</span>
                    <select required>
                      <option value="" selected disabled>Select marital status</option>
                      <option>Single</option>
                      <option>Married</option>
                      <option>Prefer not to say</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Field of Research</span>
                    <select required>
                      <option value="" selected disabled>Select field</option>
                      <option>Engineering / Technology</option>
                      <option>Sciences</option>
                      <option>Social Sciences</option>
                      <option>Humanities</option>
                      <option>Management / Commerce</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Year of Research</span>
                    <select required>
                      <option value="" selected disabled>Select year</option>
                      <option>1st year</option>
                      <option>2nd year</option>
                      <option>3rd year</option>
                      <option>4th year</option>
                      <option>5th year or above</option>
                    </select>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 2 of 5</span>
                  <h2>Academic Environment</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How satisfied/connected are you with your current research field?</span>
                    <select required>
                      <option value="" selected disabled>Select rating</option>
                      <option>1 - Very dissatisfied</option>
                      <option>2 - Dissatisfied</option>
                      <option>3 - Neutral</option>
                      <option>4 - Satisfied</option>
                      <option>5 - Very satisfied</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How satisfied are you with your current research progress?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="5" value="3" required />
                      <span>1 = Very dissatisfied, 5 = Very satisfied</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How supportive do you find your research supervisor?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="5" value="3" required />
                      <span>1 = Not supportive, 5 = Very supportive</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How often do you feel overwhelmed by your research workload?</span>
                    <select required>
                      <option value="" selected disabled>Select frequency</option>
                      <option>Never</option>
                      <option>Rarely</option>
                      <option>Sometimes</option>
                      <option>Often</option>
                      <option>Always</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How confident do you feel about completing your research successfully?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="5" value="3" required />
                      <span>1 = Not confident at all, 5 = Very confident</span>
                    </div>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 3 of 5</span>
                  <h2>Lifestyle and Support System</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How often do you engage in physical exercise or recreational activities?</span>
                    <select required>
                      <option value="" selected disabled>Select frequency</option>
                      <option>Daily</option>
                      <option>Several times a week</option>
                      <option>Once a week</option>
                      <option>Rarely</option>
                      <option>Never</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How strong is your support system (friends, family, colleagues)?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="5" value="3" required />
                      <span>1 = Very weak support, 5 = Very strong support</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How often do you feel a lack of work-life balance due to research commitments?</span>
                    <select required>
                      <option value="" selected disabled>Select frequency</option>
                      <option>Never</option>
                      <option>Rarely</option>
                      <option>Sometimes</option>
                      <option>Often</option>
                      <option>Always</option>
                    </select>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 4 of 5</span>
                  <h2>Well-being Indicators</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">How frequently do you feel stressed due to research-related responsibilities?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="5" value="3" required />
                      <span>1 = Never, 5 = Very frequently</span>
                    </div>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">In the past month, how often have you felt anxious about your academic future?</span>
                    <select required>
                      <option value="" selected disabled>Select frequency</option>
                      <option>Never</option>
                      <option>Rarely</option>
                      <option>Sometimes</option>
                      <option>Often</option>
                      <option>Always</option>
                    </select>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">Overall, how would you rate your current mental well-being?</span>
                    <div class="answer-box">
                      <input type="range" min="1" max="10" value="5" required />
                      <span>1 = Very poor, 10 = Excellent</span>
                    </div>
                  </label>
                </div>
              </section>

              <section class="question-sheet" data-question-sheet hidden>
                <div class="sheet-heading">
                  <span>Sheet 5 of 5</span>
                  <h2>Personal Experiences</h2>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">What are the biggest challenges you face during your research journey?</span>
                    <textarea
                      rows="5"
                      placeholder="Share the academic, personal, or emotional challenges you are facing..."
                      required
                    ></textarea>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">What factors help you cope with stress during your research?</span>
                    <textarea
                      rows="5"
                      placeholder="Mention routines, people, activities, or strategies that help you cope..."
                      required
                    ></textarea>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">If you could change one thing about the research environment at your institution, what would it be?</span>
                    <textarea
                      rows="5"
                      placeholder="Describe one institutional change that would support research scholars better..."
                      required
                    ></textarea>
                  </label>
                </div>

                <div class="question-block">
                  <label>
                    <span class="question-label">If you could give one piece of advice to your past self, what would it be?</span>
                    <textarea
                      rows="4"
                      placeholder="Write the advice you would give yourself at the start of your research journey..."
                      required
                    ></textarea>
                  </label>
                </div>
              </section>

              <div class="form-actions reference-actions">
                <button type="button" class="ghost-link light-link sheet-back" data-sheet-back disabled>Back</button>
                <button type="button" class="primary-button sheet-next" data-sheet-next>Next sheet</button>
                <button type="submit" class="primary-button sheet-submit is-locked" data-sheet-submit hidden disabled aria-disabled="true">Submit check-in</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="./assets/app.js"></script>
  </body>
</html>
