<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML Insight | MindScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="page-noise" aria-hidden="true"></div>
    <main class="ml-shell">
      <header class="ml-header glass-panel">
        <a href="./index.html" class="brand-mark">MindScope</a>
        <div class="header-actions">
          <button class="secondary-button" type="button" data-factor-toggle>Show Details</button>
          <a class="ghost-link" href="./profile.html" data-profile-exit>Exit to Profile</a>
          <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
        </div>
      </header>

      <section class="forest-stage glass-panel" aria-label="Overall well-being visualization">
        <div class="data-stream" aria-hidden="true">
          <span style="--lane: 0; --delay: 0s;"></span>
          <span style="--lane: 1; --delay: 0.35s;"></span>
          <span style="--lane: 2; --delay: 0.7s;"></span>
          <span style="--lane: 3; --delay: 1.05s;"></span>
          <span style="--lane: 4; --delay: 1.4s;"></span>
          <span style="--lane: 5; --delay: 1.75s;"></span>
          <span style="--lane: 6; --delay: 2.1s;"></span>
          <span style="--lane: 7; --delay: 2.45s;"></span>
        </div>

        <div class="forest-grid" aria-hidden="true">
          <div class="tree-node" style="--delay: 0.1s;">
            <span></span><i></i><b></b><em></em>
          </div>
          <div class="tree-node" style="--delay: 0.35s;">
            <span></span><i></i><b></b><em></em>
          </div>
          <div class="tree-node" style="--delay: 0.6s;">
            <span></span><i></i><b></b><em></em>
          </div>
          <div class="tree-node" style="--delay: 0.85s;">
            <span></span><i></i><b></b><em></em>
          </div>
          <div class="tree-node" style="--delay: 1.1s;">
            <span></span><i></i><b></b><em></em>
          </div>
        </div>

        <div class="forest-output">
          <div class="score-ring" style="--score: 0%" data-score-ring>
            <span data-wellbeing-score>--</span>
            <small>/ 100</small>
          </div>
          <div>
            <h1>Overall Well-Being</h1>
            <div class="score-strip">
              <span>Well-being <strong data-wellbeing-label>Calculating</strong></span>
              <span>Sentiment <strong data-sentiment-score>--</strong></span>
            </div>
          </div>
        </div>
      </section>

      <section class="factor-panel glass-panel" data-factor-panel hidden>
        <div class="panel-heading">
          <h2>Top contributing factors</h2>
          <span class="status-pill" data-model-source>Latest Insight</span>
        </div>
        <div class="factor-list" data-factor-list></div>
      </section>
    </main>

    <script src="./assets/app.js"></script>
  </body>
</html>
